[workspace]
members = [
    "crates/core",
    "crates/db-sqlite",
    "crates/model-anthropic",
    "crates/plugin-bootstrap",
    "crates/knowledge",
    "crates/server-api",
    "crates/client-discord",
    "crates/client-telegram",
    "crates/model-openai",
    "crates/client-twitter",
    "crates/plugin-coding",
    "crates/client-cli",
]
resolver = "2"

[workspace.dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
async-trait = "0.1"
thiserror = "2"
anyhow = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
futures = "0.3"
tokio-stream = "0.1"
